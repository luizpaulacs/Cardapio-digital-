<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Gerenciar Cardápio</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #111;
        }
        /* Estilo da Tabela de Produtos */
        .tabela-produtos {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .tabela-produtos th, .tabela-produtos td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }
        .tabela-produtos th {
            background-color: #34495e;
            color: white;
        }
        .img-mini {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
            margin: 0 auto;
        }
        .input-texto {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .input-preco {
            width: 90px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-acao {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn-salvar { background-color: #3498db; color: white; }
        .btn-salvar:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ Painel do Administrador</h1>
        <p>Altere os preços ou atualize o link da foto dos produtos. As mudanças refletem imediatamente no app do cliente.</p>

        <table class="tabela-produtos">
            <thead>
                <tr>
                    <th style="width: 70px; text-align: center;">Foto Atual</th>
                    <th>Produto</th>
                    <th style="width: 110px;">Preço (R$)</th>
                    <th>Link da Nova Foto (URL)</th>
                    <th style="width: 100px;">Ações</th>
                </tr>
            </thead>
            <tbody id="lista-admin">
                <tr>
                    <td colspan="5" style="text-align: center;">Carregando produtos...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        // Importando apenas o necessário do Firestore (Sem o Storage)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuração oficial com as suas credenciais
        const firebaseConfig = {
            apiKey: "AIzaSyBIOTndcpgCqT9YYpEScaDRsqvAPH8p6_Y",
            authDomain: "cardapio-digital-d87ae.firebaseapp.com",
            projectId: "cardapio-digital-d87ae",
            storageBucket: "cardapio-digital-d87ae.firebasestorage.app",
            messagingSenderId: "26239101821",
            appId: "1:26239101821:web:66e67a40d74db4beeeba14"
        };

        // Inicializa o Firebase e o Banco de Dados
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tbody = document.getElementById('lista-admin');
        const produtosRef = collection(db, "produtos");

        // Listar produtos na tabela do Admin em tempo real
        onSnapshot(produtosRef, (snapshot) => {
            if (snapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Nenhum produto encontrado.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";

            snapshot.forEach((docItem) => {
                const produto = docItem.data();
                const id = docItem.id;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: center;">
                        <img src="${produto.imagemUrl || 'https://via.placeholder.com/50'}" class="img-mini" id="img-${id}">
                    </td>
                    <td>
                        <strong>${produto.nome}</strong><br>
                        <small style="color: #777;">${produto.descricao || 'Sem descrição.'}</small>
                    </td>
                    <td>
                        <input type="number" step="0.01" class="input-preco" id="preco-${id}" value="${produto.preco || 0}">
                    </td>
                    <td>
                        <!-- Campo de texto para colar a nova URL da foto diretamente do celular -->
                        <input type="text" class="input-texto" id="url-${id}" value="${produto.imagemUrl || ''}" placeholder="Cole o link .jpg ou .png aqui">
                    </td>
                    <td>
                        <button class="btn-acao btn-salvar" id="btn-${id}">Salvar</button>
                    </td>
                `;

                tbody.appendChild(tr);

                // Evento para salvar as alterações do produto correspondente
                document.getElementById(`btn-${id}`).addEventListener('click', () => {
                    salvarAlteracoes(id);
                });
            });
        });

        // Função para atualizar Preço E Link de Imagem de uma só vez no Firestore
        async function salvarAlteracoes(id) {
            const novoPrecoInput = document.getElementById(`preco-${id}`).value;
            const novaUrlInput = document.getElementById(`url-${id}`).value.trim();
            const novoPrecoNumero = parseFloat(novoPrecoInput);

            if (isNaN(novoPrecoNumero) || novoPrecoNumero < 0) {
                alert("Por favor, digite um preço válido.");
                return;
            }

            try {
                const produtoDocRef = doc(db, "produtos", id);
                
                // Atualiza os dois campos de uma vez só
                await updateDoc(produtoDocRef, {
                    preco: novoPrecoNumero,
                    imagemUrl: novaUrlInput // Salva o novo link digitado ou colado
                });
                
                alert("Alterações salvas com sucesso!");
            } catch (erro) {
                console.error("Erro ao atualizar o produto:", erro);
                alert("Ocorreu um erro ao salvar as modificações no banco de dados.");
            }
        }
    </script>
</body>
</html>
