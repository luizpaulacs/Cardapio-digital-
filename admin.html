<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🛠️ Admin · Gestão do Cardápio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(145deg, #f4f7fc 0%, #eef2f6 100%);
            min-height: 100vh;
            padding: 28px 20px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Header principal */
        .admin-header {
            background: linear-gradient(115deg, #1e2f3f 0%, #0f1e2a 100%);
            border-radius: 32px;
            padding: 28px 32px;
            margin-bottom: 32px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        /* Variação de cor para o Header se for Doces */
        .admin-header.tema-doces {
            background: linear-gradient(115deg, #4a2c3a 0%, #2a1420 100%);
        }

        .admin-header::before {
            content: "🍽️";
            position: absolute;
            bottom: -15px;
            right: 20px;
            font-size: 6rem;
            opacity: 0.06;
            pointer-events: none;
        }

        .admin-header h1 {
            font-size: 1.9rem;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.3px;
            margin-bottom: 12px;
        }

        .admin-header h1::before {
            content: "🛠️";
            font-size: 1.8rem;
        }

        .admin-header p {
            color: #b9d0e2;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge-live {
            background: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Tabela responsiva - estilo card em mobile */
        .table-wrapper {
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            border: 1px solid rgba(230, 126, 34, 0.12);
        }

        .tabela-produtos {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .tabela-produtos thead tr {
            background: linear-gradient(105deg, #2c3e50, #243342);
        }

        /* Variação de cor da tabela para o tema doces */
        .tema-doces .tabela-produtos thead tr {
            background: linear-gradient(105deg, #4a2c3a, #361b28);
        }

        .tabela-produtos th {
            padding: 18px 16px;
            text-align: left;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tabela-produtos td {
            padding: 18px 16px;
            border-bottom: 1px solid #f0eef2;
            vertical-align: middle;
            background-color: white;
            transition: background 0.2s;
        }

        .tabela-produtos tr:hover td {
            background-color: #fefaf5;
        }

        /* Estilo da miniatura */
        .img-mini {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            display: block;
            transition: transform 0.2s;
        }

        .img-mini:hover {
            transform: scale(1.05);
        }

        .produto-nome {
            font-weight: 700;
            color: #1e2f3f;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .produto-desc {
            font-size: 0.7rem;
            color: #8ba0ae;
            line-height: 1.3;
            max-width: 220px;
        }

        /* Campos de input modernos */
        .input-preco {
            width: 100px;
            padding: 10px 12px;
            border: 2px solid #e5eaef;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s;
            font-family: inherit;
            background: white;
        }

        .input-preco:focus {
            border-color: #e67e22;
            outline: none;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.1);
        }

        .input-url {
            width: 220px;
            padding: 10px 14px;
            border: 2px solid #e5eaef;
            border-radius: 28px;
            font-size: 0.75rem;
            transition: all 0.2s;
            font-family: inherit;
            background: white;
        }

        .input-url:focus {
            border-color: #e67e22;
            outline: none;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.1);
        }

        /* Botão moderno */
        .btn-salvar {
            background: linear-gradient(105deg, #e67e22, #d35400);
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(211, 84, 0, 0.2);
        }

        .btn-salvar:hover {
            transform: translateY(-2px);
            background: linear-gradient(105deg, #d35400, #b64900);
            box-shadow: 0 6px 14px rgba(211, 84, 0, 0.3);
        }

        /* Estilo para mobile (transformar tabela em cards) */
        @media (max-width: 780px) {
            body { padding: 16px; }
            .admin-header { padding: 20px 24px; }
            .admin-header h1 { font-size: 1.5rem; }
            .table-wrapper { border-radius: 24px; overflow-x: auto; }
            .tabela-produtos { min-width: 680px; }
        }

        @media (max-width: 900px) {
            .table-wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }

        .loading-row td {
            text-align: center;
            padding: 48px !important;
            color: #8ba0ae;
            font-weight: 500;
        }

        .empty-row td {
            text-align: center;
            padding: 48px !important;
            background: #fefaf5;
            color: #b87c4a;
            font-weight: 500;
        }

        /* Toast de notificação */
        .toast-notify {
            position: fixed;
            bottom: 24px;
            right: 24px;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            animation: slideInRight 0.3s ease;
            backdrop-filter: blur(8px);
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .acao-cell { white-space: nowrap; }
        footer { text-align: center; margin-top: 32px; font-size: 0.7rem; color: #9cb1c0; }
    </style>
</head>
<body>

    <div class="container" id="admin-container">
        <div class="admin-header" id="header-area">
            <h1 id="titulo-admin">Gerenciar Cardápio</h1>
            <p>
                <span>✨ Edite preços e imagens dos produtos</span>
                <span class="badge-live">🔄 Tempo real</span>
                <span id="txt-sub-loja">📡 Mudanças refletem instantaneamente</span>
            </p>
        </div>

        <div class="table-wrapper">
            <table class="tabela-produtos">
                <thead>
                    <tr>
                        <th style="width: 80px; text-align: center;">Foto</th>
                        <th>Produto</th>
                        <th style="width: 110px;">Preço (R$)</th>
                        <th>URL da imagem</th>
                        <th style="width: 110px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-admin">
                    <tr class="loading-row">
                        <td colspan="5">
                            <span>🍔 Carregando produtos do cardápio...</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <footer>
            ⚡ As alterações são salvas automaticamente no Firebase · sincronização com o app do cliente
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIOTndcpgCqT9YYpEScaDRsqvAPH8p6_Y",
            authDomain: "cardapio-digital-d87ae.firebaseapp.com",
            projectId: "cardapio-digital-d87ae",
            storageBucket: "cardapio-digital-d87ae.firebasestorage.app",
            messagingSenderId: "26239101821",
            appId: "1:26239101821:web:66e67a40d74db4beeeba14"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tbody = document.getElementById('lista-admin');
        const produtosRef = collection(db, "produtos");

        // --- INTEGRAÇÃO PARÂMETRO MULTI-LOJAS PELA URL ---
        const urlParams = new URLSearchParams(window.location.search);
        const lojaAtual = urlParams.get('loja') || 'lanches'; // Fallback padrão para lanches

        // Altera de forma dinâmica o tema estético da tabela de gerenciamento
        const headerArea = document.getElementById('header-area');
        const adminContainer = document.getElementById('admin-container');
        const tituloAdmin = document.getElementById('titulo-admin');
        const txtSubLoja = document.getElementById('txt-sub-loja');

        if (lojaAtual === 'doces') {
            headerArea.classList.add('tema-doces');
            adminContainer.classList.add('tema-doces');
            tituloAdmin.innerText = "Gerenciar Confeitaria";
            txtSubLoja.innerText = "🍰 Editando o setor de Doces e Sobremesas";
        } else {
            tituloAdmin.innerText = "Gerenciar Lanchonete";
            txtSubLoja.innerText = "🍔 Editando o setor de Lanches e Bebidas";
        }

        // Função para mostrar notificações elegantes
        function showToast(message, isError = false) {
            const existingToast = document.querySelector('.toast-notify');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast-notify';
            toast.innerHTML = isError ? `❌ ${message}` : `✅ ${message}`;
            if (isError) {
                toast.style.background = "rgba(192, 57, 43, 0.95)";
            } else {
                toast.style.background = "rgba(39, 174, 96, 0.95)";
            }
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2800);
        }

        // Atualização em tempo real dos produtos aplicando o filtro modular do comércio
        onSnapshot(produtosRef, (snapshot) => {
            if (snapshot.empty) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="5">📭 Nenhum produto cadastrado ainda. Adicione pelo painel de cadastro.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            let totalExibidos = 0;

            snapshot.forEach((docItem) => {
                const produto = docItem.data();
                const id = docItem.id;

                // FILTRO MULTI-LOJAS: Só monta a linha na tabela se a tag bater com a URL aberta
                if (produto.comercio === lojaAtual) {
                    totalExibidos++;
                    const imagemUrl = produto.imagemUrl || 'https://placehold.co/400x300?text=Sem+Imagem';

                    const tr = document.createElement('tr');
                    tr.setAttribute('data-id', id);
                    
                    // Célula da imagem
                    const tdImg = document.createElement('td');
                    tdImg.style.textAlign = 'center';
                    const img = document.createElement('img');
                    img.src = imagemUrl;
                    img.alt = produto.nome;
                    img.className = 'img-mini';
                    img.onerror = () => { img.src = 'https://placehold.co/400x300?text=Imagem+Indispon%C3%ADvel'; };
                    tdImg.appendChild(img);
                    
                    // Célula nome + descrição
                    const tdInfo = document.createElement('td');
                    tdInfo.innerHTML = `
                        <div class="produto-nome">${escapeHtml(produto.nome)}</div>
                        <div class="produto-desc">${escapeHtml(produto.descricao || 'Sem descrição cadastrada')}</div>
                    `;
                    
                    // Célula preço (input)
                    const tdPreco = document.createElement('td');
                    const precoInput = document.createElement('input');
                    precoInput.type = 'number';
                    precoInput.step = '0.01';
                    precoInput.min = '0';
                    precoInput.value = produto.preco || 0;
                    precoInput.className = 'input-preco';
                    precoInput.id = `preco-${id}`;
                    tdPreco.appendChild(precoInput);
                    
                    // Célula URL (input)
                    const tdUrl = document.createElement('td');
                    const urlInput = document.createElement('input');
                    urlInput.type = 'text';
                    urlInput.value = produto.imagemUrl || '';
                    urlInput.placeholder = 'https://exemplo.com/foto.jpg';
                    urlInput.className = 'input-url';
                    urlInput.id = `url-${id}`;
                    tdUrl.appendChild(urlInput);
                    
                    // Célula ação (botão salvar)
                    const tdAcao = document.createElement('td');
                    tdAcao.className = 'acao-cell';
                    const btnSalvar = document.createElement('button');
                    btnSalvar.innerHTML = '💾 Salvar';
                    btnSalvar.className = 'btn-salvar';
                    btnSalvar.id = `btn-${id}`;
                    tdAcao.appendChild(btnSalvar);
                    
                    tr.appendChild(tdImg);
                    tr.appendChild(tdInfo);
                    tr.appendChild(tdPreco);
                    tr.appendChild(tdUrl);
                    tr.appendChild(tdAcao);
                    
                    tbody.appendChild(tr);
                    
                    // Evento de clique unificado modular para salvar alterações do item
                    btnSalvar.onclick = async (e) => {
                        e.preventDefault();
                        const novoPreco = parseFloat(precoInput.value);
                        const novaUrl = urlInput.value.trim();
                        
                        if (isNaN(novoPreco) || novoPreco < 0) {
                            showToast("Digite um preço válido (ex: 29,90)", true);
                            return;
                        }
                        
                        const originalText = btnSalvar.innerHTML;
                        btnSalvar.innerHTML = '⏳ Salvando...';
                        btnSalvar.disabled = true;
                        
                        try {
                            const produtoRef = doc(db, "produtos", id);
                            const updates = {
                                preco: novoPreco,
                                imagemUrl: novaUrl
                            };
                            await updateDoc(produtoRef, updates);
                            
                            img.src = novaUrl || 'https://placehold.co/400x300?text=Sem+Imagem';
                            img.onerror = () => { img.src = 'https://placehold.co/400x300?text=Erro+na+URL'; };
                            
                            showToast(`Produto "${produto.nome}" atualizado com sucesso!`);
                        } catch (error) {
                            console.error("Erro ao atualizar:", error);
                            let errorMessage = "Erro ao salvar. Verifique conexão e permissões.";
                            if (error.message.includes("permission")) {
                                errorMessage = "Sem permissão de escrita. Ajuste as regras do Firebase.";
                            }
                            showToast(errorMessage, true);
                        } finally {
                            btnSalvar.innerHTML = originalText;
                            btnSalvar.disabled = false;
                        }
                    };
                    
                    // Preview reativo da imagem ao perder o foco (blur) do campo de input
                    urlInput.onblur = () => {
                        const testUrl = urlInput.value.trim();
                        if (testUrl && (testUrl.startsWith('http://') || testUrl.startsWith('https://'))) {
                            const tempImg = new Image();
                            tempImg.onload = () => { img.src = testUrl; };
                            tempImg.src = testUrl;
                        } else if (testUrl === '') {
                            img.src = 'https://placehold.co/400x300?text=Sem+Imagem';
                        }
                    };
                }
            });

            // Se a coleção tiver produtos, mas nenhum bater com a categoria selecionada pela URL
            if (totalExibidos === 0) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="5">📭 Nenhum produto desta categoria cadastrado ainda. Use a tela de cadastro primeiro.</td></tr>`;
            }
        }, (error) => {
            console.error("Erro no snapshot:", error);
            tbody.innerHTML = `<tr class="empty-row"><td colspan="5">⚠️ Erro ao carregar produtos. Verifique sua conexão e regras de segurança do Firebase.</td></tr>`;
            showToast("Falha na conexão com o banco de dados", true);
        });
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>
</html>
