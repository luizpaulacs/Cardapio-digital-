<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>👨‍🍳 Cozinha Central · Painel de Pedidos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            padding: 24px 20px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');

        /* Cabeçalho moderno */
        .dashboard-header {
            max-width: 1400px;
            margin: 0 auto 32px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .title-section h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(120deg, #f9b43a, #ffdd99);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.3px;
        }

        .title-section h1::before {
            content: "👨‍🍳";
            font-size: 2rem;
            background: none;
            -webkit-background-clip: unset;
            color: #f9b43a;
        }

        .subtitle {
            color: #9ab3c4;
            font-weight: 500;
            font-size: 0.85rem;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-badge {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 60px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            border: 1px solid rgba(249, 180, 58, 0.25);
        }

        .stat {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 0.8rem;
            color: #cddce9;
        }

        .stat strong {
            font-size: 1.4rem;
            font-weight: 800;
            color: #f9b43a;
        }

        /* Grid responsivo dos cards */
        .grid-pedidos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Cards refinados */
        .card-pedido {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 215, 150, 0.1);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-top: 6px solid #f39c12;
            position: relative;
            overflow: hidden;
        }

        .card-pedido.em_preparo {
            border-top-color: #3498db;
            background: linear-gradient(145deg, #ffffff, #fefcf9);
        }

        .card-pedido.concluido {
            border-top-color: #2ecc71;
            opacity: 0.75;
            filter: grayscale(0.05);
            background: #f4f7f5;
        }

        .card-pedido:hover {
            transform: translateY(-4px);
            box-shadow: 0 28px 40px -14px rgba(0, 0, 0, 0.4);
        }

        /* Topo do card */
        .topo-pedido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #f0e0cc;
        }

        .cliente {
            font-weight: 800;
            font-size: 1.25rem;
            background: linear-gradient(115deg, #2c3e4e, #1e2f3c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cliente::before {
            content: "👤";
            font-size: 1rem;
            background: none;
            -webkit-background-clip: unset;
            color: #e67e22;
        }

        .hora {
            font-size: 0.7rem;
            font-weight: 600;
            background: #2c3e5010;
            padding: 4px 10px;
            border-radius: 40px;
            color: #7f8c8d;
            letter-spacing: 0.3px;
        }

        /* Status badge moderno */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 80px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: fit-content;
            margin-bottom: 14px;
        }

        .badge-pendente {
            background: #fff3e0;
            color: #d35400;
            border-left: 3px solid #f39c12;
        }

        .badge-preparo {
            background: #e8f0fe;
            color: #1f6392;
            border-left: 3px solid #3498db;
        }

        .badge-pendente::before { content: "⏳"; font-size: 0.7rem; }
        .badge-preparo::before { content: "🔥"; font-size: 0.7rem; }

        /* Lista de itens aprimorada */
        .lista-itens {
            list-style: none;
            margin: 12px 0 16px 0;
            background: #fefaf5;
            border-radius: 20px;
            padding: 8px 12px;
        }

        .lista-itens li {
            padding: 8px 0;
            border-bottom: 1px solid #ffebd2;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #2c3e50;
        }

        .lista-itens li:last-child {
            border-bottom: none;
        }

        .item-qtd {
            background: #e67e2215;
            padding: 2px 8px;
            border-radius: 50px;
            font-weight: 700;
            color: #e67e22;
            font-size: 0.75rem;
        }

        .total-pedido {
            font-size: 1.2rem;
            font-weight: 800;
            text-align: right;
            margin: 12px 0 16px 0;
            color: #2c5a2e;
            background: #eff5e8;
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            width: auto;
            float: right;
        }

        /* Botões interativos */
        .acoes {
            margin-top: 8px;
            display: flex;
            gap: 12px;
            clear: both;
        }

        .btn-status {
            flex: 1;
            border: none;
            padding: 12px 8px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }

        .btn-preparar {
            background: linear-gradient(105deg, #3498db, #2980b9);
            color: white;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        .btn-preparar:hover {
            transform: scale(0.97);
            background: linear-gradient(105deg, #2c81ba, #1f6392);
        }

        .btn-concluir {
            background: linear-gradient(105deg, #2ecc71, #27ae60);
            color: white;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }

        .btn-concluir:hover {
            transform: scale(0.97);
            background: linear-gradient(105deg, #27ae60, #1e8449);
        }

        /* Mensagem vazia estilizada */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 64px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(249, 180, 58, 0.2);
        }

        .empty-state p {
            font-size: 1.1rem;
            color: #cddde9;
            margin-bottom: 16px;
        }

        .empty-state span {
            font-size: 3rem;
            opacity: 0.7;
        }

        /* badge notificação nova */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(249, 180, 58, 0.6);}
            100% { box-shadow: 0 0 0 10px rgba(249, 180, 58, 0);}
        }

        .card-pedido.novo-pedido {
            animation: pulseGlow 0.6s ease-out;
        }

        footer {
            text-align: center;
            margin-top: 48px;
            font-size: 0.7rem;
            color: #6c8ea0;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }

        @media (max-width: 680px) {
            body { padding: 16px; }
            .dashboard-header { flex-direction: column; align-items: flex-start; }
            .stats-badge { width: 100%; justify-content: space-between; }
            .title-section h1 { font-size: 1.4rem; }
            .card-pedido { padding: 16px; }
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <div class="title-section">
            <h1 id="titulo-cozinha">Cozinha Central</h1>
            <div class="subtitle">
                <span>⚡ fluxo ao vivo</span>
                <span>•</span>
                <span id="sub-loja">🔄 todos os setores</span>
            </div>
        </div>
        <div class="stats-badge" id="stats-area">
            <div class="stat"><span>📋 Pendentes</span> <strong id="pendentes-count">0</strong></div>
            <div class="stat"><span>🍳 Em preparo</span> <strong id="preparo-count">0</strong></div>
            <div class="stat"><span>✅ Finalizados</span> <strong id="concluidos-count">0</strong></div>
        </div>
    </div>

    <div id="painel-pedidos" class="grid-pedidos">
        <div class="empty-state">
            <span>🍽️</span>
            <p>Carregando pedidos ativos...</p>
        </div>
    </div>
    <footer>👨‍🍳 Cozinha inteligente · status em tempo real · gestão de fila automática</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIOTndcpgCqT9YYpEScaDRsqvAPH8p6_Y",
            authDomain: "cardapio-digital-d87ae.firebaseapp.com",
            projectId: "cardapio-digital-d87ae",
            storageBucket: "cardapio-digital-d87ae.firebasestorage.app",
            messagingSenderId: "26239101821",
            appId: "1:26239101821:web:66e67a40d74db4beeeba14"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const painelDiv = document.getElementById('painel-pedidos');
        let ultimoSnapshotIds = new Set();     
        
        // --- FILTRO MULTI-LOJAS PELA URL ---
        const urlParams = new URLSearchParams(window.location.search);
        const lojaAtual = urlParams.get('loja') || 'lanches'; // Se não passar nada na URL, assume lanches

        // Atualiza dinamicamente o título do topo conforme o nicho ativo
        const tituloCozinha = document.getElementById('titulo-cozinha');
        const subLoja = document.getElementById('sub-loja');
        if (lojaAtual === 'doces') {
            tituloCozinha.innerText = "Produção de Doces";
            subLoja.innerText = "🧁 setor confeitaria";
        } else {
            tituloCozinha.innerText = "Cozinha de Lanches";
            subLoja.innerText = "🍔 setor de chapas e frituras";
        }

        // Função para notificação sonora moderna (Web Audio)
        function tocarAlarmeNovoPedido() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                
                osc.type = "sine";
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(now + 0.45);
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            } catch(e) {
                console.log("Áudio não suportado");
            }
        }
        
        // Atualizar contadores da navbar com base exclusivamente no nicho ativo
        function atualizarContadores(pedidosFiltrados, todosPedidosDoBanco) {
            const pendentes = pedidosFiltrados.filter(p => p.status === 'pendente').length;
            const emPreparo = pedidosFiltrados.filter(p => p.status === 'em_preparo').length;
            
            // Conta os concluídos do turno para este comércio específico
            const concluidos = todosPedidosDoBanco.filter(p => p.status === 'concluido' && p.comercio === lojaAtual).length;
            
            document.getElementById('pendentes-count').innerText = pendentes;
            document.getElementById('preparo-count').innerText = emPreparo;
            document.getElementById('concluidos-count').innerText = concluidos;
        }
        
        // Escuta em tempo real a coleção limpa (evita erro de índice no celular)
        const pedidosRef = collection(db, "pedidos");
        
        onSnapshot(pedidosRef, (snapshot) => {
            let todosPedidosDoBanco = [];
            let pedidosAtivosParaFila = [];
            
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const pedidoCompleto = { id: docSnap.id, ...data };
                todosPedidosDoBanco.push(pedidoCompleto);
                
                // MUDANÇA CRUCIAL MULTI-LOJAS: Filtra na memória para exibir apenas o nicho correto
                if (data.comercio === lojaAtual && (data.status === "pendente" || data.status === "em_preparo")) {
                    pedidosAtivosParaFila.push(pedidoCompleto);
                }
            });
            
            // Ordenar por criadoEm (timestamp) mais antigo primeiro (fila de prioridade por ordem de chegada)
            pedidosAtivosParaFila.sort((a, b) => {
                const timeA = a.criadoEm ? a.criadoEm.toMillis?.() || a.criadoEm : 0;
                const timeB = b.criadoEm ? b.criadoEm.toMillis?.() || b.criadoEm : 0;
                return timeA - timeB;
            });
            
            // Atualiza contadores numéricos superiores
            atualizarContadores(pedidosAtivosParaFila, todosPedidosDoBanco);
            
            // Verificar se surgiu um NOVO pedido pendente específico deste comércio
            const novosIds = new Set(pedidosAtivosParaFila.map(p => p.id));
            let temNovoPedido = false;
            if (ultimoSnapshotIds.size > 0) {
                for (let id of novosIds) {
                    if (!ultimoSnapshotIds.has(id)) {
                        temNovoPedido = true;
                        break;
                    }
                }
            } else if (pedidosAtivosParaFila.length > 0) {
                temNovoPedido = true;
            }
            ultimoSnapshotIds = novosIds;
            
            if (temNovoPedido && pedidosAtivosParaFila.length > 0) {
                tocarAlarmeNovoPedido();
            }
            
            // Renderizar painel visual da cozinha
            if (pedidosAtivosParaFila.length === 0) {
                painelDiv.innerHTML = `
                    <div class="empty-state">
                        <span>🧑‍🍳✨</span>
                        <p>Fila vazia! Nenhum pedido pendente ou em preparo por aqui.</p>
                        <small style="color:#9bb7cd;">Os novos pedidos desse setor surgirão automaticamente aqui</small>
                    </div>
                `;
                return;
            }
            
            painelDiv.innerHTML = "";
            
            pedidosAtivosParaFila.forEach((pedido, idx) => {
                const id = pedido.id;
                const horaRaw = pedido.criadoEm;
                let horaFormatada = "--:--";
                if (horaRaw) {
                    if (typeof horaRaw.toDate === 'function') {
                        horaFormatada = horaRaw.toDate().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                    } else if (horaRaw.seconds) {
                        const date = new Date(horaRaw.seconds * 1000);
                        horaFormatada = date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                    } else {
                        horaFormatada = new Date(horaRaw).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                    }
                }
                
                const classeStatus = pedido.status === 'pendente' ? '' : 'em_preparo';
                const badgeClass = pedido.status === 'pendente' ? 'badge-pendente' : 'badge-preparo';
                const statusTexto = pedido.status === 'pendente' ? 'Aguardando cozinha' : 'Em preparo';
                
                let itensHTML = '';
                if (pedido.itens && Array.isArray(pedido.itens)) {
                    pedido.itens.forEach(item => {
                        const nomeItem = item.nome || 'Item';
                        const qtd = item.quantidade || 1;
                        itensHTML += `
                            <li>
                                <span>${nomeItem}</span>
                                <span class="item-qtd">${qtd}x</span>
                            </li>
                        `;
                    });
                } else {
                    itensHTML = '<li style="opacity:0.7;">Itens não disponíveis</li>';
                }
                
                let botoesAcao = '';
                if (pedido.status === 'pendente') {
                    botoesAcao = `
                        <button class="btn-status btn-preparar" data-id="${id}">
                            🔪 Iniciar preparo
                        </button>
                    `;
                } else if (pedido.status === 'em_preparo') {
                    botoesAcao = `
                        <button class="btn-status btn-concluir" data-id="${id}">
                            ✅ Pedido pronto / entregar
                        </button>
                    `;
                }
                
                const totalPedidoFormat = (pedido.total || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                
                const card = document.createElement('div');
                card.className = `card-pedido ${classeStatus}`;
                if (temNovoPedido && idx === 0 && pedido.status === 'pendente') {
                    card.classList.add('novo-pedido');
                    setTimeout(() => card.classList.remove('novo-pedido'), 600);
                }
                card.innerHTML = `
                    <div>
                        <div class="topo-pedido">
                            <div class="cliente">${escapeHtml(pedido.cliente || 'Cliente')}</div>
                            <div class="hora">🕒 ${horaFormatada}</div>
                        </div>
                        <div class="status-badge ${badgeClass}">${statusTexto}</div>
                        <ul class="lista-itens">
                            ${itensHTML}
                        </ul>
                    </div>
                    <div>
                        <div class="total-pedido">${totalPedidoFormat}</div>
                        <div class="acoes">
                            ${botoesAcao}
                        </div>
                    </div>
                `;
                painelDiv.appendChild(card);
            });
            
            // Anexar cliques de controle de status
            document.querySelectorAll('.btn-status').forEach(btn => {
                btn.onclick = (e) => {
                    const currentBtn = e.currentTarget;
                    const idPedido = currentBtn.getAttribute('data-id');
                    if (currentBtn.classList.contains('btn-preparar')) {
                        mudarStatusPedido(idPedido, "em_preparo");
                    } else if (currentBtn.classList.contains('btn-concluir')) {
                        mudarStatusPedido(idPedido, "concluido");
                    }
                };
            });
            
        }, (error) => {
            console.error("Erro no snapshot da cozinha:", error);
            painelDiv.innerHTML = `<div class="empty-state" style="background: rgba(231,76,60,0.1);"><span>⚠️</span><p>Erro de conexão com Firebase. Verifique regras de segurança.</p><small>${error.message}</small></div>`;
        });
        
        async function mudarStatusPedido(id, novoStatus) {
            try {
                const pedidoRef = doc(db, "pedidos", id);
                await updateDoc(pedidoRef, { status: novoStatus });
                
                const btns = document.querySelectorAll(`.btn-status[data-id="${id}"]`);
                btns.forEach(btn => {
                    const original = btn.innerHTML;
                    btn.innerHTML = novoStatus === "em_preparo" ? "⏳ Iniciando..." : "✅ Finalizado!";
                    btn.disabled = true;
                    setTimeout(() => {
                        btn.innerHTML = original;
                        btn.disabled = false;
                    }, 1000);
                });
            } catch (error) {
                console.error("Falha ao atualizar status:", error);
                const toast = document.createElement('div');
                toast.textContent = "Erro ao atualizar pedido. Tente novamente.";
                toast.style.cssText = "position:fixed; bottom:20px; left:20px; background:#c0392b; color:white; padding:10px 20px; border-radius:40px; z-index:1000; font-weight:500;";
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }
        
        document.body.addEventListener('click', () => {
            if (window.AudioContext || window.webkitAudioContext) {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
            }
        }, { once: true });
    </script>
</body>
</html>
