<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👨‍🍳 Painel da Cozinha - Pedidos</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #2c3e50;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
        }
        /* Container dos cartões de pedidos */
        .grid-pedidos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        /* Estilo do Card de Pedido individual */
        .card-pedido {
            background-color: #fff;
            color: #333;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-top: 8px solid #f39c12; /* Cor padrão para pendente */
            transition: transform 0.2s;
        }
        .card-pedido.em_preparo { border-top-color: #3498db; }
        .card-pedido.concluido { border-top-color: #2ecc71; opacity: 0.7; }

        .topo-pedido {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .cliente { font-weight: bold; font-size: 18px; color: #111; }
        .hora { font-size: 12px; color: #777; align-self: center; }
        
        .lista-itens { list-style: none; padding: 0; margin: 10px 0; }
        .lista-itens li {
            padding: 6px 0;
            border-bottom: 1px dashed #eee;
            font-size: 15px;
        }
        
        .total-pedido {
            font-size: 16px;
            font-weight: bold;
            text-align: right;
            margin-top: 10px;
            color: #2c3e50;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-pendente { background: #fef9e7; color: #d35400; }
        .badge-preparo { background: #ebf5fb; color: #2980b9; }

        .acoes {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        .btn-status {
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: background 0.2s;
        }
        .btn-preparar { background-color: #3498db; }
        .btn-preparar:hover { background-color: #2980b9; }
        .btn-concluir { background-color: #2ecc71; }
        .btn-concluir:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <h1>👨‍🍳 Pedidos da Cozinha (Tempo Real)</h1>

    <div id="painel-pedidos" class="grid-pedidos">
        <p style="text-align: center; grid-column: 1/-1;">Aguardando conexão com o servidor...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Suas credenciais oficiais
        const firebaseConfig = {
            apiKey: "AIzaSyBIOTndcpgCqT9YYpEScaDRsqvAPH8p6_Y",
            authDomain: "cardapio-digital-d87ae.firebaseapp.com",
            projectId: "cardapio-digital-d87ae",
            storageBucket: "cardapio-digital-d87ae.firebasestorage.app",
            messagingSenderId: "26239101821",
            appId: "1:26239101821:web:66e67a40d74db4beeeba14"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const painel = document.getElementById('painel-pedidos');
        let totalPedidosAntigo = -1;

        // Buscamos a coleção limpa para não forçar o uso de índices no Firebase
        const pedidosRef = collection(db, "pedidos");

        onSnapshot(pedidosRef, (snapshot) => {
            
            // 1. Filtramos apenas os pedidos pendentes ou em preparo usando JavaScript puro
            let pedidosAtivos = [];
            
            snapshot.forEach((docItem) => {
                const pedido = docItem.data();
                if (pedido.status === "pendente" || pedido.status === "em_preparo") {
                    pedidosAtivos.push({ id: docItem.id, ...pedido });
                }
            });

            // 2. Ordenamos por horário (mais antigos primeiro para organizar a fila)
            pedidosAtivos.sort((a, b) => {
                const tempoA = a.criadoEm ? a.criadoEm.toMillis() : 0;
                const tempoB = b.criadoEm ? b.criadoEm.toMillis() : 0;
                return tempoA - tempoB; 
            });

            // Se a lista estiver vazia após o filtro
            if (pedidosAtivos.length === 0) {
                painel.innerHTML = "<p style='text-align: center; grid-column: 1/-1; color: #bdc3c7;'>Nenhum pedido pendente ou em preparo no momento. 🏖️</p>";
                totalPedidosAntigo = 0;
                return;
            }

            // Alerta sonoro quando um novo pedido entra na lista
            if (totalPedidosAntigo !== -1 && pedidosAtivos.length > totalPedidosAntigo) {
                tocarAlarme();
            }
            totalPedidosAntigo = pedidosAtivos.length;

            // Limpa a tela antes de desenhar a lista atualizada
            painel.innerHTML = "";

            // 3. Renderizamos os cards dos pedidos filtrados na tela
            pedidosAtivos.forEach((pedido) => {
                const id = pedido.id;
                const horaFormatada = pedido.criadoEm ? pedido.criadoEm.toDate().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) : '--:--';

                const card = document.createElement('div');
                card.className = `card-pedido ${pedido.status}`;

                let itensHTML = "";
                pedido.itens.forEach(item => {
                    itensHTML += `<li><strong>${item.quantidade}x</strong> ${item.nome}</li>`;
                });

                const badgeClass = pedido.status === 'pendente' ? 'badge-pendente' : 'badge-preparo';
                const statusTexto = pedido.status === 'pendente' ? 'Pendente' : 'Em Preparo';

                let botaoAcaoHTML = "";
                if (pedido.status === 'pendente') {
                    botaoAcaoHTML = `<button class="btn-status btn-preparar" data-id="${id}">Começar Preparo</button>`;
                } else if (pedido.status === 'em_preparo') {
                    botaoAcaoHTML = `<button class="btn-status btn-concluir" data-id="${id}">Pronto / Entregar</button>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="topo-pedido">
                            <span class="cliente">${pedido.cliente}</span>
                            <span class="hora">${horaFormatada}</span>
                        </div>
                        <span class="status-badge ${badgeClass}">${statusTexto}</span>
                        <ul class="lista-itens">
                            ${itensHTML}
                        </ul>
                    </div>
                    <div>
                        <div class="total-pedido">Total: R$ ${pedido.total.toFixed(2).replace('.', ',')}</div>
                        <div class="acoes">
                            ${botaoAcaoHTML}
                        </div>
                    </div>
                `;
                painel.appendChild(card);
            });

            // Ativa o clique dos botões dinâmicos
            document.querySelectorAll('.btn-status').forEach(botao => {
                botao.addEventListener('click', (e) => {
                    const idPedido = e.target.getAttribute('data-id');
                    const ehParaPreparar = e.target.classList.contains('btn-preparar');
                    
                    if (ehParaPreparar) {
                        mudarStatusPedido(idPedido, "em_preparo");
                    } else {
                        mudarStatusPedido(idPedido, "concluido");
                    }
                });
            });

        }, (error) => {
            console.error("Erro na cozinha: ", error);
            painel.innerHTML = `<p style='text-align: center; grid-column: 1/-1; color: #e74c3c;'>Erro de permissão no Firestore. Verifique suas regras de segurança.</p>`;
        });

        // Função para atualizar o status do pedido no Firebase
        async function mudarStatusPedido(id, novoStatus) {
            try {
                const pedidoDocRef = doc(db, "pedidos", id);
                await updateDoc(pedidoDocRef, { status: novoStatus });
            } catch (error) {
                console.error("Erro ao atualizar status:", error);
            }
        }

        // Sistema de aviso sonoro integrado
        function tocarAlarme() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {
                console.log("Áudio pendente de interação.");
            }
        }
    </script>
</body>
</html>
