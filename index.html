<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>✨ Cardápio Digital · Flavours</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: linear-gradient(145deg, #faf8f5 0%, #f5f0eb 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2c241a;
        }

        /* Import Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap');

        h1 {
            text-align: center;
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e67e22, #d35400);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* Layout responsivo avançado */
        .layout-principal {
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
            gap: 32px;
        }

        @media(min-width: 900px) {
            .layout-principal {
                flex-direction: row;
                align-items: flex-start;
                }
        }

        /* Seção Cardápio */
        .secao-cardapio {
            flex: 7;
        }

        /* Grid elegante */
        .container-cardapio {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 26px;
        }

        .card-produto {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(0px);
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05), 0 5px 12px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255, 215, 180, 0.6);
            display: flex;
            flex-direction: column;
        }

        .card-produto:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.12);
            border-color: #ffd8b0;
        }

        .img-wrapper {
            width: 100%;
            height: 180px;
            overflow: hidden;
            background: #f9e5cf;
        }

        .card-produto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card-produto:hover img {
            transform: scale(1.03);
        }

        .info {
            padding: 18px 16px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .info h3 {
            margin: 0 0 6px 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: #2c1f12;
            letter-spacing: -0.2px;
        }

        .descricao {
            font-size: 0.8rem;
            color: #9b7b64;
            line-height: 1.4;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .preco {
            font-size: 1.45rem;
            font-weight: 800;
            color: #e67e22;
            margin: 8px 0 12px 0;
            letter-spacing: -0.5px;
        }

        .btn {
            border: none;
            padding: 12px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-add {
            background: linear-gradient(105deg, #2ecc71, #27ae60);
            color: white;
            box-shadow: 0 3px 8px rgba(46, 204, 113, 0.25);
        }

        .btn-add:hover {
            background: linear-gradient(105deg, #27ae60, #1e8e4a);
            transform: scale(0.97);
            box-shadow: 0 5px 12px rgba(46, 204, 113, 0.3);
        }

        /* Carrinho moderno */
        .secao-carrinho {
            flex: 3;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 24px 20px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 210, 170, 0.5);
            position: sticky;
            top: 20px;
            height: fit-content;
            transition: all 0.2s;
        }

        .secao-carrinho h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c241a;
            margin-bottom: 18px;
            border-left: 5px solid #e67e22;
            padding-left: 16px;
        }

        .item-carrinho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0e2d4;
            padding: 14px 0;
            font-size: 0.9rem;
        }

        .item-carrinho strong {
            font-size: 0.95rem;
            color: #422c1a;
        }

        .item-carrinho small {
            color: #b47c48;
            font-weight: 500;
        }

        .total-carrinho {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 2px dashed #f0cfb0;
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            color: #2c1f12;
        }

        .input-cliente {
            width: 100%;
            padding: 14px 16px;
            margin-top: 12px;
            border: 1.5px solid #ffe1c4;
            border-radius: 50px;
            background: white;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        .input-cliente:focus {
            outline: none;
            border-color: #e67e22;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
        }

        .btn-pedido {
            background: linear-gradient(105deg, #e67e22, #d35400);
            color: white;
            font-size: 1rem;
            margin-top: 24px;
            padding: 14px;
            border-radius: 60px;
            font-weight: 700;
            letter-spacing: 0.3px;
            transition: all 0.2s;
            box-shadow: 0 8px 18px rgba(211, 84, 0, 0.25);
        }

        .btn-pedido:hover:not(:disabled) {
            background: linear-gradient(105deg, #d35400, #b64900);
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(211, 84, 0, 0.3);
        }

        .btn-pedido:disabled {
            background: #cfc6bd;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Carrinho vazio estilizado */
        .empty-cart-message {
            text-align: center;
            padding: 28px 10px;
            color: #c7ad93;
            font-weight: 500;
            background: #fef8f2;
            border-radius: 28px;
            margin-top: 8px;
        }

        /* Remover item */
        .remove-item {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #d98c5f;
            transition: 0.1s;
            padding: 2px 8px;
            border-radius: 30px;
        }

        .remove-item:hover {
            color: #c0392b;
            background: #fee2dd;
        }

        /* Loading shimmer */
        .skeleton-loader {
            grid-column: span 1;
            background: #ede5db;
            border-radius: 28px;
            height: 300px;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.75rem;
            color: #b7a084;
        }

        .subhead-container {
            text-align: center;
            margin-bottom: 35px;
        }

        .subhead {
            color: #7f6b5c;
            font-weight: 500;
            font-size: 0.95rem;
            border-bottom: 1px solid #ffe0c0;
            display: inline-block;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>

    <h1 id="titulo-marca">Flavours Cardápio</h1>
    <div class="subhead-container">
        <span class="subhead" id="subtitulo-marca">ingredientes selecionados · sabor artesanal</span>
    </div>

    <div class="layout-principal">
        <div class="secao-cardapio">
            <div id="cardapio" class="container-cardapio">
                <div class="skeleton-loader"></div>
                <div class="skeleton-loader"></div>
                <div class="skeleton-loader"></div>
            </div>
        </div>

        <div class="secao-carrinho">
            <h2>🛍️ Seu pedido</h2>
            <div id="itens-carrinho" class="empty-cart-message">
                🧺 Carrinho vazio · adicione delícias
            </div>
            
            <div class="total-carrinho">
                <span>Total</span>
                <span id="valor-total">R$ 0,00</span>
            </div>

            <div style="margin-top: 20px;">
                <label for="nome-cliente" style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #b16e3a;">Nome / Mesa</label>
                <input type="text" id="nome-cliente" class="input-cliente" placeholder="Ex: Mesa 12 · Ana Costa" autocomplete="off">
            </div>

            <button class="btn btn-pedido" id="btn-fechar-pedido" disabled>✨ Finalizar pedido</button>
            <p style="font-size: 11px; text-align: center; margin-top: 12px; color: #ad8a6c;">🔒 Pedido confirmado em tempo real</p>
        </div>
    </div>
    <footer id="footer-marca">pedidos direto para a produção · acompanhe em tempo real</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIOTndcpgCqT9YYpEScaDRsqvAPH8p6_Y",
            authDomain: "cardapio-digital-d87ae.firebaseapp.com",
            projectId: "cardapio-digital-d87ae",
            storageBucket: "cardapio-digital-d87ae.firebasestorage.app",
            messagingSenderId: "26239101821",
            appId: "1:26239101821:web:66e67a40d74db4beeeba14"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let carrinho = [];
        let produtosDoBanco = []; 

        const cardapioDiv = document.getElementById('cardapio');
        const itensCarrinhoDiv = document.getElementById('itens-carrinho');
        const totalSpan = document.getElementById('valor-total');
        const btnPedido = document.getElementById('btn-fechar-pedido');
        const nomeClienteInput = document.getElementById('nome-cliente');

        // --- FILTRO E ADAPTAÇÃO DINÂMICA DA URL MULTI-LOJAS ---
        const urlParams = new URLSearchParams(window.location.search);
        const lojaAtual = urlParams.get('loja') || 'lanches'; // Padrão é lanches se abrir puro

        // Objetos de configurações de marca para customizar a interface baseado na URL
        const infosLojas = {
            lanches: { titulo: "🍔 Flavours Bistro", sub: "burgers artesanais · batata frita · sabor incomparável", foot: "🍔 burgers direto para a chapa · acompanhe em tempo real" },
            doces: { titulo: "🍰 Flavours Doceria", sub: "confeitaria fina · tortas · doces gourmets", foot: "🍰 sobremesas direto para a confeitaria · acompanhe em tempo real" },
            pizzas: { titulo: "🍕 Flavours Pizzaria", sub: "pizzas artesanais · forno a lenha · massa de longa fermentação", foot: "🍕 pizzas direto para o forno · acompanhe em tempo real" },
            esfihas: { titulo: "🥙 Flavours Esfiharia", sub: "esfihas abertas · tempero oriental autêntico · assadas na hora", foot: "🥙 esfihas direto para o forno · acompanhe em tempo real" },
            pasteis: { titulo: "🥟 Flavours Pastelaria", sub: "pastéis crocantes · recheio generoso · massa sequinha", foot: "🥟 pastéis direto para a fritadeira · acompanhe em tempo real" },
            sucos: { titulo: "🥤 Flavours Sucos & Bebidas", sub: "sucos naturais · polpas selecionadas · refrescância pura", foot: "🥤 bebidas preparadas na hora · acompanhe em tempo real" }
        };

        // Aplica as customizações textuais na tela
        const configAtiva = infosLojas[lojaAtual] || infosLojas['lanches'];
        document.getElementById('titulo-marca').innerText = configAtiva.titulo;
        document.getElementById('subtitulo-marca').innerText = configAtiva.sub;
        document.getElementById('footer-marca').innerText = configAtiva.foot;


        // 1. Carregar produtos do Firestore aplicando filtro inteligente por comércio
        onSnapshot(collection(db, "produtos"), (snapshot) => {
            if (snapshot.empty) {
                cardapioDiv.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px;">🍂 Nenhum produto disponível no momento</div>`;
                return;
            }

            cardapioDiv.innerHTML = "";
            produtosDoBanco = []; 

            snapshot.forEach((doc) => {
                const produto = doc.data();
                const id = doc.id;
                
                // MUDANÇA ESSENCIAL: O cardápio só renderiza os itens que pertencem a essa loja específica
                if (produto.comercio === lojaAtual) {
                    produtosDoBanco.push({ id, ...produto });

                    const imgUrl = produto.imagemUrl && produto.imagemUrl.trim() !== "" 
                        ? produto.imagemUrl 
                        : "https://images.unsplash.com/photo-1506354666786-959d6d497f1a?w=400&h=300&fit=crop";
                    
                    const descricaoCurta = produto.descricao ? produto.descricao.substring(0, 65) : "Delicioso prato preparado com alta qualidade";
                    
                    cardapioDiv.innerHTML += `
                        <div class="card-produto">
                            <div class="img-wrapper">
                                <img src="${imgUrl}" alt="${produto.nome}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&h=300&fit=crop'">
                            </div>
                            <div class="info">
                                <div>
                                    <h3>${produto.nome}</h3>
                                    <div class="descricao">${descricaoCurta}</div>
                                </div>
                                <div>
                                    <div class="preco">R$ ${produto.preco.toFixed(2).replace('.', ',')}</div>
                                    <button class="btn btn-add" data-id="${id}">+ Adicionar ao carrinho</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            // Se existirem produtos no banco, mas nenhum for do comércio ativo na URL
            if (produtosDoBanco.length === 0) {
                cardapioDiv.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#9b7b64;">🍂 Nenhum produto cadastrado para este setor ainda.</div>`;
            }

            document.querySelectorAll('.btn-add').forEach(botao => {
                botao.onclick = (e) => {
                    e.stopPropagation();
                    const idProduto = botao.getAttribute('data-id');
                    adicionarItem(idProduto);
                };
            });
        }, (error) => {
            console.error("Erro no carregamento do cardápio:", error);
            cardapioDiv.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px;">⚠️ Erro ao carregar cardápio. Recarregue a página.</div>`;
        });

        // 2. Adicionar item ao carrinho local
        function adicionarItem(id) {
            const produtoItem = produtosDoBanco.find(p => p.id === id);
            if (!produtoItem) return;
            
            const itemExistente = carrinho.find(item => item.id === id);

            if (itemExistente) {
                itemExistente.quantidade += 1;
            } else {
                carrinho.push({
                    id: produtoItem.id,
                    nome: produtoItem.nome,
                    preco: produtoItem.preco,
                    quantidade: 1
                });
            }

            atualizarInterfaceCarrinho();
            
            const btn = document.querySelector(`.btn-add[data-id="${id}"]`);
            if (btn) {
                const originalText = btn.innerHTML;
                btn.innerHTML = "✓ Adicionado!";
                setTimeout(() => { if(btn) btn.innerHTML = originalText; }, 800);
            }
        }

        // 3. Remover item completamente
        function removerItemCompletamente(id) {
            carrinho = carrinho.filter(item => item.id !== id);
            atualizarInterfaceCarrinho();
        }

        function alterarQuantidade(id, delta) {
            const index = carrinho.findIndex(item => item.id === id);
            if (index === -1) return;
            const novaQt = carrinho[index].quantidade + delta;
            if (novaQt <= 0) {
                carrinho.splice(index, 1);
            } else {
                carrinho[index].quantidade = novaQt;
            }
            atualizarInterfaceCarrinho();
        }

        // 4. Atualizar interface do carrinho de compras lateral
        function atualizarInterfaceCarrinho() {
            if (carrinho.length === 0) {
                itensCarrinhoDiv.innerHTML = '<div class="empty-cart-message">🛒 Seu carrinho está vazio · adicione pratos incríveis ✨</div>';
                totalSpan.innerText = "R$ 0,00";
                btnPedido.disabled = true;
                return;
            }

            itensCarrinhoDiv.innerHTML = "";
            let totalGeral = 0;

            carrinho.forEach(item => {
                const subtotal = item.preco * item.quantidade;
                totalGeral += subtotal;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'item-carrinho';
                itemDiv.innerHTML = `
                    <div style="flex:3">
                        <strong>${item.nome}</strong><br>
                        <small>${item.quantidade} x R$ ${item.preco.toFixed(2).replace('.', ',')}</small>
                        <div style="display:flex; gap:10px; margin-top:6px;">
                            <button class="qty-btn minus" data-id="${item.id}" style="background:#f0e0d2; border:none; width:26px; border-radius:40px; font-weight:bold; cursor:pointer;">-</button>
                            <span style="font-weight:600; font-size:13px;">${item.quantidade}</span>
                            <button class="qty-btn plus" data-id="${item.id}" style="background:#f0e0d2; border:none; width:26px; border-radius:40px; font-weight:bold; cursor:pointer;">+</button>
                            <button class="remove-item" data-id="${item.id}" title="Remover item">🗑️</button>
                        </div>
                    </div>
                    <div style="font-weight:700; color:#e67e22;">R$ ${subtotal.toFixed(2).replace('.', ',')}</div>
                `;
                itensCarrinhoDiv.appendChild(itemDiv);
            });

            document.querySelectorAll('.qty-btn.minus').forEach(btn => {
                btn.onclick = (e) => {
                    const id = btn.getAttribute('data-id');
                    alterarQuantidade(id, -1);
                };
            });
            document.querySelectorAll('.qty-btn.plus').forEach(btn => {
                btn.onclick = (e) => {
                    const id = btn.getAttribute('data-id');
                    alterarQuantidade(id, 1);
                };
            });
            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.onclick = (e) => {
                    const id = btn.getAttribute('data-id');
                    removerItemCompletamente(id);
                };
            });

            totalSpan.innerText = totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            btnPedido.disabled = false;
        }

        // 5. Enviar pedido associando dinamicamente a tag da loja ativa
        document.getElementById('btn-fechar-pedido').onclick = async () => {
            const nomeCliente = nomeClienteInput.value.trim();

            if (!nomeCliente) {
                const alertBox = document.createElement('div');
                alertBox.textContent = "🍽️ Por favor, informe seu nome ou número da mesa para enviar o pedido!";
                alertBox.style.position = "fixed";
                alertBox.style.bottom = "20px";
                alertBox.style.left = "50%";
                alertBox.style.transform = "translateX(-50%)";
                alertBox.style.backgroundColor = "#2c1f12";
                alertBox.style.color = "#ffefd6";
                alertBox.style.padding = "12px 24px";
                alertBox.style.borderRadius = "60px";
                alertBox.style.fontWeight = "500";
                alertBox.style.zIndex = "999";
                alertBox.style.boxShadow = "0 5px 20px rgba(0,0,0,0.2)";
                alertBox.style.backdropFilter = "blur(8px)";
                document.body.appendChild(alertBox);
                setTimeout(() => alertBox.remove(), 2800);
                return;
            }

            if (carrinho.length === 0) {
                const alertMsg = document.createElement('div');
                alertMsg.textContent = "⚠️ Seu carrinho está vazio. Adicione itens para continuar.";
                alertMsg.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#d35400; color:white; padding:12px 24px; border-radius:60px; font-weight:bold; z-index:999;";
                document.body.appendChild(alertMsg);
                setTimeout(() => alertMsg.remove(), 2500);
                return;
            }

            const totalFinal = carrinho.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);
            const botao = document.getElementById('btn-fechar-pedido');
            const originalText = botao.innerText;

            botao.disabled = true;
            botao.innerText = "⏳ Enviando para cozinha...";

            try {
                // SALVA O PEDIDO NO BANCO CARIMBANDO COMPROVADAMENTE QUAL LOJA DEVE RECEBÊ-LO
                const resultado = await addDoc(collection(db, "pedidos"), {
                    comercio: lojaAtual, // Tag multi-lojas ('lanches', 'doces', 'pizzas', 'esfihas', 'pasteis', 'sucos')
                    cliente: nomeCliente,
                    itens: carrinho.map(item => ({
                        id: item.id,
                        nome: item.nome,
                        preco: item.preco,
                        quantidade: item.quantidade
                    })),
                    total: totalFinal,
                    status: "pendente",
                    criadoEm: new Date(),
                    timestamp: Date.now()
                });

                carrinho = [];
                nomeClienteInput.value = "";
                atualizarInterfaceCarrinho();

                // Redireciona o cliente para a tela de status do seu respectivo pedido
                window.location.href = `status.html?id=${resultado.id}`;
                
            } catch (erro) {
                console.error("Erro no pedido:", erro);
                const errorMsg = document.createElement('div');
                errorMsg.textContent = "❌ Erro ao enviar pedido. Verifique sua conexão e tente novamente.";
                errorMsg.style.cssText = "position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#c0392b; color:white; padding:12px 26px; border-radius:80px; font-weight:600; z-index:1000;";
                document.body.appendChild(errorMsg);
                setTimeout(() => errorMsg.remove(), 3000);
                botao.disabled = false;
                botao.innerText = originalText;
            }
        };

        window.addEventListener('load', () => {
            if (carrinho.length === 0) atualizarInterfaceCarrinho();
        });
    </script>
</body>
</html>
