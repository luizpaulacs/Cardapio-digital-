<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤵 Painel de Atendimento</title>
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .topo-painel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 26px; }

        .btn-zerar-caixa { 
            background-color: #e74c3c; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-zerar-caixa:hover { background-color: #c0392b; }
        .btn-zerar-caixa:disabled { background-color: #95a5a6; cursor: not-allowed; }

        .resumo-cards { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        .card-mini { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            text-align: center; 
        }
        .card-mini h3 { margin: 0; font-size: 14px; color: #777; }
        .card-mini p { margin: 5px 0 0 0; font-size: 24px; font-weight: bold; color: #2c3e50; }
        
        .tabela-pedidos { 
            width: 100%; 
            border-collapse: collapse; 
            background: white; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
        }
        .tabela-pedidos th, .tabela-pedidos td { 
            padding: 12px 15px; 
            text-align: left; 
            border-bottom: 1px solid #eee; 
        }
        .tabela-pedidos th { background-color: #2c3e50; color: white; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .pendente { background: #fef9e7; color: #d35400; }
        .em_preparo { background: #ebf5fb; color: #2980b9; }
        .concluido { background: #e8f8f5; color: #27ae60; }
        
        .btn-entregar { 
            background-color: #2ecc71; 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .btn-entregar:hover { background-color: #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="topo-painel">
            <h1>🤵 Controle de Atendimento</h1>
            <!-- Botão de Fechar Caixa Manual -->
            <button class="btn-zerar-caixa" id="btn-zerar-caixa">🔒 Fechar Turno / Zerar Caixa</button>
        </div>
        
        <!-- Painel numérico para controle de quantidade -->
        <div class="resumo-cards">
            <div class="card-mini">
                <h3>Pedidos Ativos</h3>
                <p id="qtd-ativos">0</p>
            </div>
            <div class="card-mini">
                <h3>Pedidos Concluídos</h3>
                <p id="qtd-concluidos">0</p>
            </div>
            <div class="card-mini">
                <h3>Total do Turno</h3>
                <p id="faturamento-total">R$ 0,00</p>
            </div>
        </div>

        <h2>Lista Geral de Pedidos</h2>
        <table class="tabela-pedidos">
            <thead>
                <tr>
                    <th>Cliente / Mesa</th>
                    <th>Itens</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="lista-atendimento">
                <tr><td colspan="5" style="text-align:center;">Carregando pedidos...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIOTndcpgCqT9YYpEScaDRsqvAPH8p6_Y",
            authDomain: "cardapio-digital-d87ae.firebaseapp.com",
            projectId: "cardapio-digital-d87ae",
            storageBucket: "cardapio-digital-d87ae.firebasestorage.app",
            messagingSenderId: "26239101821",
            appId: "1:26239101821:web:66e67a40d74db4beeeba14"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const tbody = document.getElementById('lista-atendimento');
        let idsPedidosParaArquivar = []; // Guarda temporariamente o que limpar da tela

        // Escuta os pedidos em tempo real
        onSnapshot(collection(db, "pedidos"), (snapshot) => {
            let ativos = 0, concluidos = 0, faturamento = 0;
            tbody.innerHTML = "";
            idsPedidosParaArquivar = []; // Limpa o array de suporte antes da atualização

            let todosPedidos = [];
            
            snapshot.forEach(d => {
                const dados = d.data();
                // REGRA CRUCIAL: Só joga no painel o que NÃO foi arquivado em turnos anteriores
                if (dados.status !== "concluido_arquivado") {
                    todosPedidos.push({ id: d.id, ...dados });
                }
            });

            // Ordena os pedidos locais por horário: os mais novos no topo
            todosPedidos.sort((a,b) => (b.criadoEm?.toMillis() || 0) - (a.criadoEm?.toMillis() || 0));

            if (todosPedidos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#999;">Nenhum pedido neste turno.</td></tr>`;
                document.getElementById('qtd-ativos').innerText = "0";
                document.getElementById('qtd-concluidos').innerText = "0";
                document.getElementById('faturamento-total').innerText = "R$ 0,00";
                return;
            }

            todosPedidos.forEach((pedido) => {
                // Adiciona o ID à nossa lista de alvos do fechamento de caixa
                idsPedidosParaArquivar.push(pedido.id);

                if (pedido.status === "concluido") {
                    concluidos++;
                    faturamento += pedido.total || 0;
                } else {
                    ativos++;
                }

                // Une o array de itens numa única linha de texto legível
                const itensTxt = pedido.itens.map(i => `${i.quantidade}x ${i.nome}`).join(', ');

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${pedido.cliente}</strong></td>
                        <td><small>${itensTxt}</small></td>
                        <td>R$ ${pedido.total.toFixed(2).replace('.',',')}</td>
                        <td><span class="badge ${pedido.status}">${statusTexto(pedido.status)}</span></td>
                        <td>
                            ${pedido.status !== 'concluido' ? `<button class="btn-entregar" data-id="${pedido.id}">Finalizar/Entregar</button>` : '✔️ Entregue'}
                        </td>
                    </tr>
                `;
            });

            // Atualiza os painéis numéricos superiores
            document.getElementById('qtd-ativos').innerText = ativos;
            document.getElementById('qtd-concluidos').innerText = concluidos;
            document.getElementById('faturamento-total').innerText = faturamento.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            // Captura o clique do botão "Finalizar/Entregar" de cada linha
            document.querySelectorAll('.btn-entregar').forEach(btn => {
                btn.onclick = async (e) => {
                    const id = e.target.getAttribute('data-id');
                    await updateDoc(doc(db, "pedidos", id), { status: "concluido" });
                };
            });
        });

        // LÓGICA DO BOTÃO MANUAL DE FECHAMENTO DE CAIXA
        document.getElementById('btn-zerar-caixa').onclick = async () => {
            if (idsPedidosParaArquivar.length === 0) {
                alert("O caixa já está limpo e sem pedidos registrados!");
                return;
            }

            const confirma = confirm("⚠️ ATENÇÃO:\nDeseja fechar o caixa do turno atual?\n\nIsso vai ocultar todos os pedidos da tela e zerar o faturamento para o início do próximo expediente.");
            if (!confirma) return;

            const btnZerar = document.getElementById('btn-zerar-caixa');
            btnZerar.innerText = "Fechando...";
            btnZerar.disabled = true;

            try {
                // Executa a alteração em lote de todos os pedidos atuais na tela
                for (let id of idsPedidosParaArquivar) {
                    await updateDoc(doc(db, "pedidos", id), {
                        status: "concluido_arquivado"
                    });
                }
                alert("🔒 Turno encerrado e caixa zerado com sucesso!");
            } catch (erro) {
                console.error("Erro ao encerrar turno:", erro);
                alert("Erro ao fechar o caixa. Verifique sua conexão.");
            } finally {
                btnZerar.innerText = "🔒 Fechar Turno / Zerar Caixa";
                btnZerar.disabled = false;
            }
        };

        // Função auxiliar de legenda de status
        function statusTexto(status) {
            if (status === 'pendente') return 'Pendente';
            if (status === 'em_preparo') return 'Cozinhando';
            return 'Pronto';
        }
    </script>
</body>
</html>
